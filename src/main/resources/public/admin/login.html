<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snapbase — Admin Login</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Geist, Inter, Arial, sans-serif;
    font-size: 14px; font-weight: 400; line-height: 20px;
    background: #fafafa; color: #171717;
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .card {
    background: #fff;
    border: 1px solid #ebebeb;
    border-radius: 12px;
    padding: 24px;
    width: 100%; max-width: 400px;
  }
  h1 {
    font-size: 20px; font-weight: 600; line-height: 28px; letter-spacing: -0.4px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: 0;
    font-family: Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace;
    text-transform: uppercase; color: #8f8f8f;
    margin-bottom: 4px;
  }
  input {
    width: 100%;
    background: #fff; color: #171717; border: 1px solid #ebebeb; border-radius: 6px;
    font-family: Geist, Inter, Arial, sans-serif; font-size: 14px; font-weight: 400; line-height: 20px;
    padding: 8px 12px; margin-bottom: 16px;
    outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: #0070f3; }
  button {
    width: 100%;
    background: #171717; color: #fff;
    border: none; border-radius: 6px;
    font-family: Geist, Inter, Arial, sans-serif; font-size: 14px; font-weight: 500; line-height: 20px;
    padding: 8px 12px;
    cursor: pointer; transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-bottom: 16px; font-size: 14px; line-height: 20px; }
  .msg--error { color: #ee0000; }
</style>
</head>
<body>
<div class="card" x-data="loginPage()">
  <h1>Admin Login</h1>
  <form @submit.prevent="submit">
    <label for="email">Email</label>
    <input type="email" id="email" x-model="email" required autocomplete="email">
    <label for="password">Password</label>
    <input type="password" id="password" x-model="password" required autocomplete="current-password">
    <div class="msg msg--error" x-show="error" x-text="error"></div>
    <button type="submit" :disabled="submitting">Log In</button>
  </form>
</div>

<script>
function loginPage() {
  return {
    email: "", password: "", submitting: false, error: "",
    async submit() {
      this.submitting = true; this.error = "";
      try {
        const res = await fetch("/admin/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: this.email, password: this.password }),
        });
        const data = await res.json();
        if (data.status === "success") {
          localStorage.setItem("snapbase_token", data.token);
          window.location.href = "/admin/dashboard.html";
        } else {
          this.error = data.message || "Invalid credentials";
        }
      } catch (e) { this.error = "Network error"; }
      this.submitting = false;
    },
  };
}
</script>
</body>
</html>
