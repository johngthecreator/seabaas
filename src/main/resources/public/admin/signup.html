<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seabaas — Admin Setup</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Geist, Inter, Arial, sans-serif;
    font-size: 14px; font-weight: 400; line-height: 20px;
    background: #fafafa; color: #171717;
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .card {
    background: #fff;
    border: 1px solid #ebebeb;
    border-radius: 12px;
    padding: 24px;
    width: 100%; max-width: 400px;
  }
  h1 {
    font-size: 20px; font-weight: 600; line-height: 28px; letter-spacing: -0.4px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: 0;
    font-family: Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace;
    text-transform: uppercase; color: #8f8f8f;
    margin-bottom: 4px;
  }
  input {
    width: 100%;
    background: #fff; color: #171717; border: 1px solid #ebebeb; border-radius: 6px;
    font-family: Geist, Inter, Arial, sans-serif; font-size: 14px; font-weight: 400; line-height: 20px;
    padding: 8px 12px; margin-bottom: 16px;
    outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: #0070f3; }
  button {
    width: 100%;
    background: #171717; color: #fff;
    border: none; border-radius: 6px;
    font-family: Geist, Inter, Arial, sans-serif; font-size: 14px; font-weight: 500; line-height: 20px;
    padding: 8px 12px;
    cursor: pointer; transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-bottom: 16px; font-size: 14px; line-height: 20px; }
  .msg--error { color: #ee0000; }
  .msg--success { color: #0070f3; }
  .msg--mono { font-family: Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #8f8f8f; text-transform: uppercase; text-align: center; }
</style>
</head>
<body>
<div class="card" x-data="setupPage()">
  <h1>Admin Setup</h1>
  <div x-show="loading" class="msg msg--mono" style="padding:32px 0">Loading…</div>
  <div x-show="!loading && complete" class="msg msg--success">Account created. Redirecting to dashboard…</div>
  <div x-show="!loading && !complete">
    <div x-show="!code" class="msg msg--error">No setup code provided.</div>
    <template x-if="code">
      <form @submit.prevent="submit">
        <label for="name">Name</label>
        <input type="text" id="name" x-model="name" required autocomplete="name">
        <label for="email">Email</label>
        <input type="email" id="email" x-model="email" required autocomplete="email">
        <label for="password">Password</label>
        <input type="password" id="password" x-model="password" required minlength="8" autocomplete="new-password">
        <div class="msg msg--error" x-show="error" x-text="error"></div>
        <button type="submit" :disabled="submitting">Create Admin Account</button>
      </form>
    </template>
  </div>
</div>

<script>
function setupPage() {
  return {
    code: new URLSearchParams(window.location.search).get("code"),
    name: "", email: "", password: "",
    loading: false, complete: false, submitting: false, error: "",
    async submit() {
      this.submitting = true; this.error = "";
      try {
        const res = await fetch("/admin/setup", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: this.name, email: this.email, password: this.password, code: this.code }),
        });
        const data = await res.json();
        if (data.status === "success") {
          localStorage.setItem("seabaas_token", data.token);
          this.complete = true;
          setTimeout(() => { window.location.href = "/admin/dashboard.html"; }, 1500);
        } else {
          this.error = data.message || "Setup failed";
        }
      } catch (e) { this.error = "Network error"; }
      this.submitting = false;
    },
  };
}
</script>
</body>
</html>
